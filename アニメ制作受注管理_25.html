<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>アニメ制作受注管理</title>
<style>
:root{
  --bg:#F2F5FB;--sur:#fff;--sur2:#EBF0FA;--sur3:#DDE5F5;
  --bdr:rgba(0,80,180,.10);--bdr2:rgba(0,80,180,.20);
  --txt:#0A1A3A;--txt2:#4A5A7A;--txt3:#8A9ABB;
  --bl:#0060E0;--bl-bg:#E0ECFF;--bl-dk:#003A8C;--bl-md:#5090E8;
  --pk:#E02080;--pk-bg:#FCEAF3;--pk-dk:#8C0048;--pk-md:#E870AF;
  --am:#C07010;--am-bg:#FEF3E0;
  --gn:#0060E0;--gn-bg:#E0ECFF;--gn-dk:#003A8C;--gn-md:#5090E8;
  --rd:#C02030;--rd-bg:#FCEAEC;
  --r:8px;--rl:12px;--rs:5px;
  --sh:0 1px 4px rgba(0,60,180,.10),0 1px 2px rgba(0,60,180,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif;
  background:var(--bg);color:var(--txt);font-size:14px;min-height:100vh}
button,input,select,textarea{font-family:inherit}

/* HEADER */
.hdr{background:linear-gradient(135deg,#0060E0 0%,#0048B0 60%,#C01870 100%);
  height:48px;display:flex;align-items:center;padding:0 1rem;gap:0;
  position:sticky;top:0;z-index:100;border-bottom:none}
.logo{font-size:15px;font-weight:600;color:#fff;margin-right:1.25rem;white-space:nowrap}
.logo span{color:#FFD0E8}
.nav{display:flex;height:48px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nt{padding:0 12px;height:100%;display:flex;align-items:center;gap:4px;
  font-size:13px;font-weight:500;color:rgba(255,255,255,.7);cursor:pointer;
  border-bottom:2.5px solid transparent;white-space:nowrap;transition:all .12s}
.nt:hover{color:#fff}
.nt.on{color:#fff;border-bottom-color:#FFD0E8}
.nbadge{background:rgba(255,255,255,.2);color:rgba(255,255,255,.85);
  border-radius:99px;font-size:10px;padding:1px 6px;border:0.5px solid rgba(255,255,255,.3)}
.nt.on .nbadge{background:#FFD0E8;color:var(--pk-dk)}
.hdr-r{display:flex;align-items:center;gap:5px;margin-left:8px;flex-shrink:0}
.lbtn{padding:3px 9px;border-radius:99px;border:0.5px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.15);color:#fff;font-size:11px;cursor:pointer;transition:background .15s}
.lbtn:hover,.lbtn.on{background:rgba(255,255,255,.4)}
.sync{font-size:11px;color:rgba(255,255,255,.7);display:flex;align-items:center;gap:4px;margin-right:4px}
.sdot{width:6px;height:6px;border-radius:50%;background:#4ade80}
.sdot.ing{background:#fbbf24;animation:pulse .8s infinite}
.sdot.err{background:#f87171}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* MAIN */
.main{padding:1.25rem;max-width:1200px;margin:0 auto}
.view{display:none}.view.on{display:block}

/* BUTTONS */
.btn{padding:6px 12px;border-radius:var(--r);font-size:13px;cursor:pointer;
  border:0.5px solid var(--bdr2);background:var(--sur);color:var(--txt);
  transition:background .12s;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:var(--sur2)}
.btn.pri{background:var(--bl);color:#fff;border-color:var(--bl)}
.btn.pri:hover{background:var(--bl-dk)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.dng{color:var(--rd)}.btn.dng:hover{background:var(--rd-bg)}

/* STATUS PILLS */
.pill{font-size:11px;padding:3px 9px;border-radius:99px;font-weight:500;white-space:nowrap}
.p-or{background:#E0ECFF;color:#003A8C;border:0.5px solid #80B0F0}
.p-wip{background:var(--am-bg);color:#7A4400;border:0.5px solid #E8B050}
.p-dn{background:#E0ECFF;color:#003A8C;border:0.5px solid #80B0F0}
.p-iv{background:var(--pk-bg);color:var(--pk-dk);border:0.5px solid var(--pk-md)}

/* DUE WARN */
.due{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:500;
  padding:2px 8px;border-radius:99px;background:var(--rd-bg);color:#6B1818;
  border:0.5px solid #EE9090;white-space:nowrap}
.due.soon{background:var(--am-bg);color:#5C3800;border-color:#E8A030}

/* CARD */
.card{background:var(--sur);border:0.5px solid var(--bdr);border-radius:var(--rl);
  padding:1rem 1.25rem;margin-bottom:10px;cursor:pointer;
  transition:border-color .12s,box-shadow .12s;box-shadow:var(--sh)}
.card:hover{border-color:var(--bdr2);box-shadow:0 2px 6px rgba(0,0,0,.1)}

/* BANNER */
.banner{border-radius:var(--r);padding:9px 12px;margin-bottom:8px;
  display:flex;align-items:center;justify-content:space-between;gap:8px}
.bn-l{font-size:15px;font-weight:500;flex:1;min-width:0;display:flex;align-items:baseline;gap:4px}
.bn-abbr{font-size:12px;font-weight:400;opacity:.75}
.bn-ep{font-size:13px;font-weight:500;opacity:.85}
.bn-r{font-size:12px;opacity:.7;white-space:nowrap;flex-shrink:0}

/* META ROW */
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));
  gap:3px 10px;font-size:12px;color:var(--txt2);margin-bottom:8px}
.meta b{color:var(--txt);font-weight:500}
.sub{font-size:12px;color:var(--txt2);margin-bottom:5px}
.acts{display:flex;gap:5px;flex-wrap:wrap}

/* PROGRESS BAR */
.pbar{margin-bottom:8px}
.pbar-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--txt2);margin-bottom:3px}
.pbar-bg{height:4px;background:var(--sur3);border-radius:99px;overflow:hidden}
.pbar-fill{height:100%;background:linear-gradient(90deg,#0060E0,#4090F0);
  border-radius:99px;transition:width .3s}

/* MONTH HEADER */
.mhdr{display:flex;align-items:center;padding:6px 4px 5px;
  border-bottom:2px solid var(--bl);margin-bottom:4px}
.mhdr span{background:var(--bl);color:#fff;padding:2px 10px;
  border-radius:99px;font-size:12px;font-weight:600}

/* FORM */
.fcard{background:var(--sur);border:0.5px solid var(--bdr);border-radius:var(--rl);
  padding:1.25rem;margin-bottom:1rem;box-shadow:var(--sh)}
.fttl{font-size:15px;font-weight:500;margin-bottom:1rem;padding-bottom:.75rem;
  border-bottom:0.5px solid var(--bdr);display:flex;align-items:center;gap:8px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:11px;font-weight:500;color:var(--txt2);
  text-transform:uppercase;letter-spacing:.05em}
.fg input,.fg select,.fg textarea{font-size:13px;padding:7px 10px;
  border:0.5px solid var(--bdr2);border-radius:var(--r);
  background:var(--sur);color:var(--txt);width:100%}
.fg input:focus,.fg select:focus,.fg textarea:focus{
  outline:2px solid var(--bl);border-color:var(--bl)}
.fg input[readonly]{background:var(--sur2);color:var(--txt2)}
.fgrid{display:grid;gap:10px 14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}
.sep{grid-column:1/-1;border:none;border-top:0.5px solid var(--bdr);margin:2px 0}
.slbl{grid-column:1/-1;font-size:11px;font-weight:600;color:var(--txt2);
  text-transform:uppercase;letter-spacing:.06em}
.ffoot{display:flex;gap:8px;justify-content:flex-end;
  margin-top:1rem;padding-top:.75rem;border-top:0.5px solid var(--bdr)}

/* COMBO */
.cbo{position:relative}
.cbo-i{width:100%;font-size:13px;padding:7px 28px 7px 10px;
  border:0.5px solid var(--bdr2);border-radius:var(--r);
  background:var(--sur);color:var(--txt)}
.cbo-i:focus{outline:2px solid var(--bl);border-color:var(--bl)}
.cbo-a{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  pointer-events:none;color:var(--txt3);font-size:12px}
.cbo-dd{position:absolute;top:calc(100% + 2px);left:0;right:0;
  background:var(--sur);border:0.5px solid var(--bdr2);border-radius:var(--r);
  z-index:50;max-height:180px;overflow-y:auto;display:none;
  box-shadow:0 4px 12px rgba(0,0,0,.1)}
.cbo-dd.open{display:block}
.cbo-item{padding:7px 10px;font-size:13px;cursor:pointer;
  display:flex;align-items:center;gap:8px;color:var(--txt)}
.cbo-item:hover{background:var(--sur2)}
.cbo-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cbo-new{padding:7px 10px;font-size:12px;color:var(--bl);cursor:pointer;
  border-top:0.5px solid var(--bdr);display:flex;align-items:center;gap:5px}
.cbo-new:hover{background:var(--bl-bg)}

/* CUT INPUT */
.cbox{background:var(--bl-bg);border:0.5px solid var(--bl-md);
  border-radius:var(--r);padding:10px 12px}
.cbox-lbl{font-size:12px;font-weight:500;color:var(--bl-dk);margin-bottom:4px}
.cbox-hint{font-size:11px;color:var(--bl);margin-bottom:6px;line-height:1.6}
.cbox-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cbox-row input{flex:1;min-width:180px;font-size:13px;padding:6px 10px;
  border:0.5px solid var(--bl-md);border-radius:var(--r);background:#fff;color:var(--bl-dk)}
.climit{font-size:12px;color:var(--bl);white-space:nowrap}

/* SUM CARDS */
.sumrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
  gap:10px;margin-bottom:1rem}
.sc{border-radius:var(--r);padding:.75rem 1rem}
.sc .sl{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.sc .sv{font-size:18px;font-weight:500}
.sc .ss{font-size:11px;margin-top:3px}
.sc-bl{background:#E0ECFF}.sc-bl .sl{color:var(--bl)}.sc-bl .sv{color:#0A2D6A}.sc-bl .ss{color:var(--bl)}
.sc-pk{background:var(--pk-bg)}.sc-pk .sl{color:var(--pk)}.sc-pk .sv{color:var(--pk-dk)}.sc-pk .ss{color:var(--pk)}
.sc-gn{background:#E6F4FF}.sc-gn .sl{color:#0070D0}.sc-gn .sv{color:#003A8C}.sc-gn .ss{color:#0070D0}
.sc-gy{background:var(--sur2)}.sc-gy .sl{color:var(--txt2)}.sc-gy .sv{color:var(--txt)}

/* CUT GRID */
.csec{background:var(--sur);border:0.5px solid var(--bdr);
  border-radius:var(--rl);padding:1rem 1.25rem;margin-bottom:1rem;box-shadow:var(--sh)}
.csec-hd{display:flex;align-items:center;gap:8px;margin-bottom:.75rem;flex-wrap:wrap}
.csec-hd h3{font-size:14px;font-weight:500;flex:1}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:5px}
.cc{aspect-ratio:1;border-radius:var(--r);border:0.5px solid var(--bdr2);
  background:var(--sur);display:flex;flex-direction:column;align-items:center;
  justify-content:center;cursor:pointer;position:relative;
  transition:border-color .12s,background .12s;user-select:none}
.cc:hover{border-color:var(--bl)}
.cc.dn{background:#E0ECFF;border-color:#80B0F0}
.cc .cn{font-size:11px;font-weight:500;text-align:center;padding:0 3px;word-break:break-all;line-height:1.3}
.cc .cd{font-size:10px;color:var(--txt3);margin-top:2px}
.cc.dn .cn{color:var(--bl-dk)}.cc.dn .cd{color:var(--bl)}
.cc .ck{position:absolute;top:3px;right:3px;width:13px;height:13px;
  background:var(--bl);border-radius:50%;display:flex;align-items:center;
  justify-content:center;opacity:0}
.cc.dn .ck{opacity:1}

/* INFO GRID */
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;
  font-size:13px;margin-bottom:1rem}
.ir .ik{font-size:11px;color:var(--txt2);font-weight:500;
  text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.ir .iv{color:var(--txt);font-weight:500}

/* GROUP */
.gc{display:flex;align-items:center;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
.gc label{font-size:12px;color:var(--txt2);font-weight:500}
.gc select{font-size:13px;padding:6px 10px;border:0.5px solid var(--bdr2);
  border-radius:var(--r);background:var(--sur);color:var(--txt)}
.gsec{margin-bottom:1.5rem}
.ghd{display:flex;align-items:center;gap:10px;padding:8px 14px;
  border-radius:var(--r);background:var(--sur2);margin-bottom:8px;cursor:pointer}
.ghd h3{font-size:14px;font-weight:500;flex:1}
.gsub{display:flex;gap:14px;font-size:12px;flex-wrap:wrap}
.gsub b{color:var(--txt)}
.gbody{border-left:3px solid;padding-left:10px}

/* SEARCH */
.srch-card{background:var(--sur);border:1.5px solid var(--bl);
  border-radius:var(--rl);padding:1rem 1.25rem;margin-bottom:10px;
  box-shadow:0 2px 8px rgba(0,96,224,.12)}
.srch-card .sct{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:.5rem}
.srch-cut{display:inline-flex;align-items:center;gap:5px;
  background:var(--bl-bg);color:var(--bl-dk);padding:3px 10px;
  border-radius:99px;font-size:13px;font-weight:600;border:0.5px solid var(--bl-md)}
.srch-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:3px 12px;font-size:12px;color:var(--txt2);margin-top:.5rem}
.srch-meta b{color:var(--txt);font-weight:500}
.srch-acts{margin-top:.75rem;display:flex;gap:6px;flex-wrap:wrap}
.cdone{display:inline-flex;align-items:center;gap:4px;background:#E0ECFF;
  color:#003A8C;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:500}
.ctodo{background:var(--am-bg);color:#5C3800;padding:2px 8px;
  border-radius:99px;font-size:11px;font-weight:500;display:inline-block}

/* DETAIL */
.dhd{display:flex;align-items:center;gap:8px;margin-bottom:.75rem;flex-wrap:wrap}
.back{font-size:12px;color:var(--txt2);cursor:pointer;display:flex;align-items:center;
  gap:4px;padding:5px 10px;border:0.5px solid var(--bdr2);border-radius:var(--r);
  background:var(--sur)}
.back:hover{background:var(--sur2)}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;
  transform:translateX(-50%) translateY(60px);
  background:var(--txt);color:var(--bg);padding:9px 18px;
  border-radius:99px;font-size:13px;font-weight:500;
  transition:transform .2s;z-index:999;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--rd);color:#fff}

/* TOP BTN */
.topbtn{position:fixed;bottom:24px;right:24px;width:44px;height:44px;
  border-radius:50%;background:var(--pk);color:#fff;border:none;
  font-size:20px;cursor:pointer;display:none;align-items:center;
  justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.2);
  transition:opacity .2s,transform .2s;z-index:90}
.topbtn:hover{opacity:.88;transform:translateY(-2px)}
.topbtn.show{display:flex}

/* MISC */
.lh{display:flex;align-items:center;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
.lh h2{font-size:15px;font-weight:500;flex:1}
.empty{text-align:center;padding:3rem 1rem;color:var(--txt3);font-size:13px}
.empty i{font-size:30px;display:block;margin-bottom:10px}
.loading{display:flex;align-items:center;justify-content:center;
  padding:3rem;gap:10px;color:var(--txt3);font-size:13px}
.spin{width:18px;height:18px;border:2px solid var(--bdr2);
  border-top-color:var(--bl);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media print{
  .hdr,.nav,.btn,.acts,.back,.gc,.topbtn{display:none!important}
}
@media(max-width:600px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .s3,.s4{grid-column:span 2}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="logo">✂ <span id="logo-txt">受注管理</span></div>
  <nav class="nav">
    <div class="nt on" onclick="showView('list')" id="tab-list">受注一覧<span class="nbadge" id="b-all">0</span></div>
    <div class="nt" onclick="showView('new')" id="tab-new">＋ 新規受注</div>
    <div class="nt" onclick="showView('progress')" id="tab-progress">カット進捗<span class="nbadge" id="b-prog">0</span></div>
    <div class="nt" onclick="showView('group')" id="tab-group">グループ表示</div>
  </nav>
  <div class="hdr-r">
    <div class="sync"><div class="sdot" id="sdot"></div><span id="slbl">--</span></div>
    <button class="lbtn on" id="btn-ja" onclick="selectLang('ja')">🇯🇵 JP</button>
    <button class="lbtn" id="btn-vi" onclick="selectLang('vi')">🇻🇳 VN</button>
  </div>
</header>

<main class="main">
  <!-- LIST -->
  <div class="view on" id="view-list">
    <div class="lh">
      <h2 id="h-list">受注一覧</h2>
      <select id="list-sort" onchange="renderList()" style="font-size:12px;padding:5px 8px;border:0.5px solid var(--bdr2);border-radius:var(--r);background:var(--sur);color:var(--txt)">
        <option value="desc" id="opt-desc">新しい順</option>
        <option value="asc" id="opt-asc">古い順</option>
      </select>
      <select id="flt-st" onchange="renderList()" style="font-size:12px;padding:5px 8px;border:0.5px solid var(--bdr2);border-radius:var(--r);background:var(--sur);color:var(--txt)">
        <option value="" id="opt-all">すべて</option>
        <option id="opt-or">受注済</option>
        <option id="opt-wip">進行中</option>
        <option id="opt-dn">納品済</option>
        <option id="opt-iv">請求済</option>
        <option value="uninvoiced" id="opt-un">未請求</option>
      </select>
      <button class="btn pri" onclick="showView('new')" id="btn-new">＋ 新規受注</button>
      <button class="btn" onclick="loadAll()" id="btn-refresh">↺ 更新</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:1rem;flex-wrap:wrap">
      <div style="position:relative;flex:1;min-width:200px;max-width:360px">
        <input type="text" id="cut-search-input" oninput="searchCut()"
          placeholder="✂ カット番号で検索（例：C9999, 9999）"
          style="width:100%;font-size:13px;padding:7px 36px 7px 10px;border:0.5px solid var(--bdr2);border-radius:var(--r);background:var(--sur);color:var(--txt)">
        <span onclick="clearSearch()" id="srch-clr"
          style="position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--txt3);font-size:16px;display:none">×</span>
      </div>
      <div id="srch-hint" style="font-size:12px;color:var(--txt2)"></div>
    </div>
    <div id="srch-result" style="display:none;margin-bottom:1rem"></div>
    <div id="list-body"></div>
  </div>

  <!-- NEW/EDIT -->
  <div class="view" id="view-new">
    <div class="fcard">
      <div class="fttl">📄 <span id="form-ttl">新規受注入力</span></div>
      <div class="fgrid g4">
        <div class="fg"><label id="lbl-od">受注日</label><input type="date" id="f-od"></div>
        <div class="fg"><label id="lbl-due">納期</label><input type="date" id="f-due"></div>
        <div class="fg"><label id="lbl-dl">納入日</label><input type="date" id="f-dl"></div>
        <div class="fg"><label id="lbl-inv">請求日</label><input type="date" id="f-inv"></div>
        <hr class="sep"><div class="slbl" id="slbl-work">作品情報</div>
        <div class="fg s2"><label id="lbl-cust">顧客</label>
          <div class="cbo"><input class="cbo-i" type="text" id="f-cust"
            oninput="filterCbo('cust')" onfocus="openCbo('cust')" onblur="closeCbo('cust')">
            <span class="cbo-a">▾</span><div class="cbo-dd" id="dd-cust"></div></div></div>
        <div class="fg"><label id="lbl-ct">担当者</label>
          <div class="cbo"><input class="cbo-i" type="text" id="f-ct"
            oninput="filterCbo('ct')" onfocus="openCbo('ct')" onblur="closeCbo('ct')">
            <span class="cbo-a">▾</span><div class="cbo-dd" id="dd-ct"></div></div></div>
        <div class="fg"></div>
        <div class="fg s2"><label id="lbl-ttl">作品タイトル</label>
          <div class="cbo"><input class="cbo-i" type="text" id="f-ttl"
            oninput="onTitleInput()" onfocus="openCbo('ttl')" onblur="closeCbo('ttl')">
            <span class="cbo-a">▾</span><div class="cbo-dd" id="dd-ttl"></div></div></div>

function sync(s){
  const d=document.getElementById('sdot');
  const l=document.getElementById('slbl');
  if(s==='ing'){d.className='sdot ing';l.textContent=t('syncing');}
  else if(s==='err'){d.className='sdot err';l.textContent=t('syncErr');}
  else{d.className='sdot';l.textContent=t('synced');}
}

function selectLang(lang){
  currentLang=lang;
  localStorage.setItem('animeLang',lang);
  applyLang();
  const av=document.querySelector('.view.on');
  if(av){
    const vid=av.id.replace('view-','');
    if(vid==='list')renderList();
    else if(vid==='progress')renderProg();
    else if(vid==='group')renderGroup();
    else if(vid==='detail'&&currentId)showDetail(currentId);
  }
}

async function fbSet(path, data){
  sync('ing');
  try{
    await set(ref(db, path), data);
    sync('ok');
  }catch(e){ sync('err'); showToast(e.message,true); throw e; }
}
async function fbUpdate(path, data){
  sync('ing');

async function loadAll(){

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function fmt(n){ return (n!=null&&n!=='')&&!isNaN(n)?Math.round(Number(n)).toLocaleString('ja-JP'):'-'; }
function today(){ return new Date().toISOString().slice(0,10); }
function normDate(v){
  if(!v && v!==0) return '';
  const s=String(v);
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  if(/^\d{4}-\d{2}-\d{2}T/.test(s)) return s.slice(0,10);
  return '';
}
function normDates(o){
  ['orderDate','dueDate','deliveryDate','invoiceDate'].forEach(f=>{ o[f]=normDate(o[f]); });
  if(o.cuts) o.cuts=o.cuts.map(c=>({...c,id:String(c.id)}));
  return o;
}
function daysUntil(d){
  if(!d) return null;
  const n=new Date(); n.setHours(0,0,0,0);
  const due=new Date(d); due.setHours(0,0,0,0);
  return Math.round((due-n)/86400000);
}
function dueBadge(due,st){
  if(['納品済','請求済'].includes(st)) return '';
  const d=daysUntil(due); if(d===null) return '';
  if(d<0)  return `<span class="due">${t('dueOver')} ${Math.abs(d)}${t('days')}</span>`;
  if(d===0) return `<span class="due soon">${t('dueToday')}</span>`;
  if(d<=2)  return `<span class="due soon">${t('dueSoon')}${d}${t('days')}</span>`;
  return '';
}
function getStatus(o){
  if(o.invoiceDate) return '請求済';
  if(o.deliveryDate) return '納品済';
  const done=(o.cuts||[]).filter(c=>c.done).length;
  const total=(o.cuts||[]).length;
  if(done>0&&done<total) return '進行中';
  if(done>0&&done===total) return '納品済';
  return o.status||'受注済';
}
function pillCls(s){ return {受注済:'p-or',進行中:'p-wip',納品済:'p-dn',請求済:'p-iv'}[s]||'p-or'; }
function progOf(o){
  const done=(o.cuts||[]).filter(c=>c.done).length;
  const total=Number(o.qty)||0;
  return {done,total,pct:total>0?Math.round(done/total*100):0};
}
function invMonth(o){
  if(!o.invoiceDate) return t('optUn');
  return o.invoiceDate.slice(0,7).replace('-','年')+'月';
}
function hashOf(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))%6; return h; }
const BANNERS=[

function bannerOf(s){ return BANNERS[hashOf(s||'')]; }
function bcOf(s){ return BCOLS[hashOf(s||'')%BCOLS.length]; }

// カット番号パース
// ============================================================
function parseCuts(str){
  const ids=[];
  str.split(',').map(s=>s.trim()).filter(Boolean).forEach(p=>{
    if(p.indexOf('~')>=0||p.indexOf('〜')>=0||p.indexOf('～')>=0){
      const tilde=p.indexOf('~')>=0?'~':p.indexOf('〜')>=0?'〜':'～';
      const pts=p.split(tilde);
      if(pts.length===2){
        const ml=pts[0].trim().match(/^([Cc]?)(\d+)$/);
        const mr=pts[1].trim().match(/^([Cc]?)(\d+)$/);
        if(ml&&mr){
          const pre=(ml[1]||mr[1]||'').toUpperCase();
          const s=parseInt(ml[2]),e=parseInt(mr[2]);
          const pad=Math.max(ml[2].length,mr[2].length);
          for(let i=s;i<=e;i++) ids.push(pre+String(i).padStart(pad,'0'));
          return;
        }
      }
      ids.push(p.toUpperCase()); return;
    }
    if(p.indexOf('-')>=0||p.indexOf('_')>=0){
      p.split(/[-_]/).forEach(pt=>{ pt=pt.trim(); if(pt) ids.push(pt.toUpperCase()); });
      return;
    }
    ids.push(p.toUpperCase());
  });
  const seen=new Set();
  return ids.filter(x=>{ if(seen.has(x)) return false; seen.add(x); return true; });
}
function parseGroups(str){
  const groups=[];
  str.split(',').map(s=>s.trim()).filter(Boolean).forEach(p=>{
    if(p.indexOf('~')>=0||p.indexOf('〜')>=0||p.indexOf('～')>=0){
      const tilde=p.indexOf('~')>=0?'~':p.indexOf('〜')>=0?'〜':'～';
      const pts=p.split(tilde);
      if(pts.length===2){
        const ml=pts[0].trim().match(/^([Cc]?)(\d+)$/);
        const mr=pts[1].trim().match(/^([Cc]?)(\d+)$/);
        if(ml&&mr){
          const pre=(ml[1]||mr[1]||'').toUpperCase();
          const s=parseInt(ml[2]),e=parseInt(mr[2]);
          const pad=Math.max(ml[2].length,mr[2].length);
          for(let i=s;i<=e;i++){
            const id=pre+String(i).padStart(pad,'0');
            groups.push({label:id,ids:[id]});
          }
          return;
        }
      }
      groups.push({label:p.toUpperCase(),ids:[p.toUpperCase()]}); return;
    }
    if(p.indexOf('-')>=0||p.indexOf('_')>=0){
      const pts=p.split(/[-_]/).map(x=>x.trim()).filter(Boolean).map(x=>x.toUpperCase());
      if(pts.length>0) groups.push({label:p.toUpperCase(),ids:pts});
      return;
    }
    groups.push({label:p.toUpperCase(),ids:[p.toUpperCase()]});
  });
  return groups;
}

function normCutId(s){
  s=String(s).trim().toUpperCase();
  const m=s.match(/^([Cc]?)(\d+)$/);
  if(!m) return s;
  return {prefix:m[1],num:m[2],raw:s};
}
function cutMatch(inp,cid){
  const a=normCutId(inp), b=normCutId(String(cid));
  if(typeof a==='string'||typeof b==='string')
    return String(inp).toUpperCase()===String(cid).toUpperCase();
  return parseInt(a.num,10)===parseInt(b.num,10);
}

async function toggleGroup(ids){

  const gc=ids.map(id=>(o.cuts||[]).find(c=>String(c.id)===String(id))).filter(Boolean);

  gc.forEach(c=>{ c.done=!allDone; c.date=!allDone?today():''; });

  document.getElementById('d-st').value=getStatus(o);
  document.getElementById('d-pill').innerHTML=`<span class="pill ${pillCls(getStatus(o))}">${tSt(getStatus(o))}</span>`;

async function toggleCut(cid){

  const o=orders.find(x=>x.id===currentId); if(!o||(o.cuts||[]).length===0) return;
  const allDone=(o.cuts||[]).every(c=>c.done);
  (o.cuts||[]).forEach(c=>{ c.done=!allDone; c.date=!allDone?today():''; });
  renderCuts(o); autoStatus(o); updateSumCard(o);
  await saveCutsToFb(o);
  showToast(t('saved'));
}
async function saveCutsToFb(o){
  const cutsObj={};
  (o.cuts||[]).forEach((c,i)=>{ cutsObj[i]={id:String(c.id),done:c.done,date:c.date||''}; });
  await fbUpdate(`/orders/${o.id}`,{cuts:cutsObj,status:o.status});
}
function autoStatus(o){
  const done=(o.cuts||[]).filter(c=>c.done).length;
  const total=(o.cuts||[]).length;
  if(done>0&&done<total) o.status='進行中';
  else if(done>0&&done===total) o.status='納品済';
}
function updateSumCard(o){
  const {done,total,pct}=progOf(o);
  const sv=document.querySelector('.sc-gy .sv');
  const ss=document.querySelector('.sc-gy .ss');
  if(sv) sv.textContent=`${done}/${total}`;
  if(ss) ss.textContent=pct+'%';
  document.getElementById('d-prog-pct').textContent=pct+'%';
  document.getElementById('d-prog-fill').style.width=pct+'%';
}

}

function calcAmt(){
  const qty=parseFloat(document.getElementById('f-qty').value)||0;
  const up=parseFloat(document.getElementById('f-up').value)||0;
  const ap=parseFloat(document.getElementById('f-ap').value)||0;
  const tex=qty*up, tin=Math.round(tex*(1+TAX)), at=qty*ap, mg=tin-at;
  const pct=tin>0?Math.round(mg/tin*1000)/10:null;
  document.getElementById('f-tex').value=tex?fmt(tex):'';
  document.getElementById('f-tin').value=tin?fmt(tin):'';
  document.getElementById('f-at').value=at?fmt(at):'';
  document.getElementById('f-mg').value=(tin||at)?fmt(mg):'';
  document.getElementById('f-mp').value=pct!=null?pct.toFixed(1)+'%':'';
}
function updLimit(){
  const qty=parseInt(document.getElementById('f-qty').value)||0;
  document.getElementById('cut-limit').textContent=qty?`上限 ${qty}`:' ';
  prevPreview();
}
function prevPreview(){
  const qty=parseInt(document.getElementById('f-qty').value)||0;
  const val=document.getElementById('f-cuts').value.trim();
  const el=document.getElementById('cut-preview');
  if(!val){el.textContent='';return;}

  if(qty&&ids.length>qty){el.style.color='var(--rd)';el.textContent=`⚠ ${ids.length}件（上限超え）`;}
  else{el.style.color='var(--bl)';el.textContent=ids.length?`${ids.length}件：${ids.slice(0,8).join(', ')}${ids.length>8?` …他${ids.length-8}件`:''}`:'';}
}

async function saveOrder(){
  const title=document.getElementById('f-ttl').value.trim();
  const cust=document.getElementById('f-cust').value.trim();
  const abbr=document.getElementById('f-abbr').value.trim();
  if(!title){alert(t('lblTtl')+'を入力してください');return;}
  if(!cust){alert(t('lblCust')+'を入力してください');return;}
  const qty=parseInt(document.getElementById('f-qty').value)||0;
  const cutsRaw=document.getElementById('f-cuts').value.trim();
  const cutIds=cutsRaw?parseCuts(cutsRaw):[];
  if(qty&&cutIds.length>qty){alert(`カット番号が${qty}件を超えています`);return;}
  // マスター更新
  if(!masters.customers.find(c=>c.name===cust))
    masters.customers.push({name:cust,color:colorOf(cust)});
  const existT=masters.titles.find(t2=>t2.name===title);
  if(!existT) masters.titles.push({name:title,color:colorOf(title),abbr});
  else if(abbr&&!existT.abbr) existT.abbr=abbr;
  const up=parseFloat(document.getElementById('f-up').value)||0;
  const ap=parseFloat(document.getElementById('f-ap').value)||0;
  const tex=qty*up, tin=Math.round(tex*(1+TAX)), at=qty*ap, mg=tin-at;
  const mpct=tin>0?Math.round(mg/tin*1000)/10:null;
  const prevCuts=editingId?(orders.find(x=>x.id===editingId)||{cuts:[]}).cuts:[];
  const cuts=cutIds.length>0
    ?cutIds.map(id=>{const ex=prevCuts.find(c=>String(c.id)===String(id));return ex||{id,done:false,date:''};})
    :[...prevCuts];
  const cutsObj={};
  cuts.forEach((c,i)=>{ cutsObj[i]={id:String(c.id),done:c.done,date:c.date||''}; });
  const o={
    id:editingId||uid(),
    orderDate:document.getElementById('f-od').value,
    dueDate:document.getElementById('f-due').value,
    deliveryDate:document.getElementById('f-dl').value,
    invoiceDate:document.getElementById('f-inv').value,
    customer:cust, contact:document.getElementById('f-ct').value.trim(),
    title, abbr, episode:document.getElementById('f-ep').value.trim(),
    process:document.getElementById('f-proc').value,
    qty, unitPrice:up, totalPriceEx:tex, totalPriceIn:tin,
    atUnitPrice:ap, atTotalPrice:at, margin:mg, marginPct:mpct,
    note:document.getElementById('f-note').value.trim(),
    status:'受注済', cuts:cutsObj
  };
  // cutsRawをキャッシュ
  if(cutsRaw){
    cutsRawCache[o.id]=cutsRaw;
    await fbSet(`/cutsRaw/${o.id}`,cutsRaw);
  }
  // Firebaseに保存
  await fbSet(`/orders/${o.id}`, o);
  await fbSet('/masters', masters);
  // ローカル更新
  const oCopy={...o, cuts:cuts};
  oCopy.cutsRaw=cutsRaw||undefined;
  if(editingId){
    const i=orders.findIndex(x=>x.id===editingId);
    if(i!==-1) orders[i]=oCopy;
  } else { orders.unshift(oCopy); }
  editingId=null;
  showToast(t('saved'));
  showDetail(o.id);
}

  const sorted=[...active].sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));

function renderGroup(){

  const src=flt==='uninvoiced'?orders.filter(o=>!o.invoiceDate)

    if(by==='all') return t('optAll');

function openCbo(type){ renderDd(type,''); document.getElementById('dd-'+type).classList.add('open'); }

function filterCbo(type){ renderDd(type, document.getElementById('f-'+type).value); }
function renderDd(type,q){
  const dd=document.getElementById('dd-'+type);
  let rawList;
  if(type==='ct'){
    const set={};orders.forEach(o=>{if(o.contact)set[o.contact]=true;});
    rawList=Object.keys(set).map(n=>({name:n,color:colorOf(n)}));
  } else if(type==='cust'){
    rawList=masters.customers;
  } else {
    rawList=masters.titles;
  }
  const freq={};
  orders.forEach(o=>{
    const key=type==='cust'?o.customer:type==='ttl'?o.title:o.contact;
    if(key) freq[key]=(freq[key]||0)+1;
  });
  const list=[...rawList].sort((a,b)=>{
    const fa=freq[a.name]||0,fb=freq[b.name]||0;
    if(fb!==fa) return fb-fa;
    return a.name.localeCompare(b.name,'ja');
  });
  const filtered=q?list.filter(x=>x.name.toLowerCase().includes(q.toLowerCase())):list;
  let html=filtered.map(x=>`<div class="cbo-item" onmousedown="pickCbo('${type}','${x.name.replace(/\/g,'\\').replace(/'/g,"\'")}')">
    <span class="cbo-dot" style="background:${x.color||'#999'}"></span>${x.name}
    ${type==='ttl'&&x.abbr?`<span style="font-size:11px;color:var(--txt3)">(${x.abbr})</span>`:''}</div>`).join('');
  const isNew=q&&!list.find(x=>x.name===q);
  if(isNew) html+=`<div class="cbo-new" onmousedown="pickCbo('${type}','${q.replace(/\/g,'\\').replace(/'/g,"\'")}')">＋「${q}」を追加</div>`;
  dd.innerHTML=html||`<div style="padding:8px 10px;font-size:12px;color:var(--txt3)">入力して追加できます</div>`;
}
function pickCbo(type,val){
  document.getElementById('f-'+type).value=val;
  document.getElementById('dd-'+type).classList.remove('open');
  if(type==='cust'&&!masters.customers.find(c=>c.name===val))
    masters.customers.push({name:val,color:colorOf(val)});
  if(type==='ct') return;
  if(type==='ttl'){
    const found=masters.titles.find(t2=>t2.name===val);
    if(!found) masters.titles.push({name:val,color:colorOf(val)});
    const el=document.getElementById('f-abbr'),lbl=document.getElementById('abbr-auto');
    if(found&&found.abbr){el.value=found.abbr;lbl.style.display='inline';}
    else{lbl.style.display='none';}
  }
}

  if(b) b.classList.toggle('show',window.scrollY>200);
